<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>On Hands</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f3f8;--card:#fff;--tx:#1d2330;--mut:#6b7385;--ln:#dfe3ec;--pri:#3b6fd8;--sale:#cfe3d8;--amt:#f1e2c8;--tot:#d3d3d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a21;--card:#232734;--tx:#e8ebf2;--mut:#98a0b3;--ln:#363c4d;--pri:#7aa2f7;--sale:#2c4a3c;--amt:#554423;--tot:#30343f}}
:root[data-theme="dark"]{--bg:#171a21;--card:#232734;--tx:#e8ebf2;--mut:#98a0b3;--ln:#363c4d;--pri:#7aa2f7;--sale:#2c4a3c;--amt:#554423;--tot:#30343f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:560px;margin:0 auto}
.tabs{display:flex;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:2px solid var(--ln)}
.tabs button{flex:1;padding:12px;border:0;background:none;color:var(--mut);font-weight:600;font-size:15px;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--pri);border-color:var(--pri)}
.bar{display:flex;gap:8px;padding:10px;align-items:center}
.bar input,.bar select{flex:1;min-width:0;padding:8px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);font-size:14px}
.bar button{padding:9px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);font-weight:600}
.row,.hd{display:grid;grid-template-columns:22px minmax(90px,1.6fr) var(--w0,52px) var(--w1,52px) var(--w2,52px) var(--w3,52px);gap:4px;align-items:center;padding:3px 8px;border-bottom:1px solid var(--ln)}
.hd{font-weight:600;color:var(--mut);font-size:13px;text-align:center}
.nm{font-size:13.5px;line-height:1.2}.nm small{display:block;color:var(--mut)}
input.n{width:100%;min-width:0;height:28px;padding:2px 4px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);text-align:center;font-size:13px}
.s,.a{padding:8px 2px;border-radius:10px;text-align:center;font-size:12.5px}
.s{background:var(--sale)}.a{background:var(--amt)}
.tot{background:var(--tot);font-weight:700}
.tot .s,.tot .a,.tot .v{background:var(--card);padding:4px 2px;border-radius:8px;text-align:center;font-size:12.5px}
.tot .s{background:var(--sale)}.tot .a{background:var(--amt)}
.gt{background:var(--tot);font-weight:700}
.empty{padding:30px;text-align:center;color:var(--mut)}
.sr{text-align:center;color:var(--mut);font-size:13px}
.rate{background:none;border:0;color:var(--pri);font-size:11px;padding:0}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;display:none;font-size:13px}
.row{scroll-margin-top:110px}
#mn{display:none;position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.ph{display:flex;gap:16px;align-items:center;background:#12294a;color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 14px;font-size:20px;position:sticky;top:0}
.ph b{font-size:18px}.ph span{cursor:pointer}
.pb{max-width:560px;margin:0 auto;padding:12px}
.pbtn{display:flex;gap:8px}.pbtn button{flex:1;padding:12px 6px;border:0;border-radius:10px;color:#fff;font-size:14px}
.bl{background:#2f6fe0}.rd{background:#d9534f}
#pinfo{font-size:12.5px;color:var(--mut);margin:8px 0}
#mq{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);margin-bottom:12px;font-size:14px}
.tb{background:var(--card);border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.th,.tr{display:grid;grid-template-columns:30px 1fr 56px 84px;gap:6px;align-items:center;padding:14px 10px;border-bottom:1px solid var(--ln);font-size:14px}
.th{font-weight:700}.pn{cursor:pointer}
.ac{display:flex;gap:6px}.ac button{width:36px;height:34px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx)}
.ac button.arm{background:#d9534f;color:#fff}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;align-items:center;justify-content:center;padding:14px}
.box{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:420px}
.box h3{margin:0 0 10px;display:flex;justify-content:space-between}
.box label{font-size:13px;display:block;margin:8px 0 4px}
.box input,.box select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box .bl{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;color:#fff;font-size:15px}
.row.s1,.hd.s1{grid-template-columns:22px minmax(70px,1fr) var(--s0,62px) var(--s1,62px) var(--s2,62px)}
#lk{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;align-items:center;justify-content:center;padding:14px}
.sc{overflow-x:scroll;padding-bottom:4px}.sc>.in{width:max-content;min-width:100%}
.sc::-webkit-scrollbar{height:10px}.sc::-webkit-scrollbar-thumb{background:var(--mut);border-radius:6px}.sc::-webkit-scrollbar-track{background:var(--ln)}
.locked #v1 input{pointer-events:none;opacity:.65}.locked #dt,.locked #mb{opacity:.5}
.nb{padding-bottom:0;scrollbar-width:none}.nb::-webkit-scrollbar{display:none}
.row:not(.tot):not(.gt),.hd{background:var(--bg)}
#v1 .row>:nth-child(-n+2),#v1 .hd>:nth-child(-n+2){position:sticky;z-index:2;background:inherit}
#v1 .row>:nth-child(1),#v1 .hd>:nth-child(1){left:0}
#v1 .row>:nth-child(2),#v1 .hd>:nth-child(2){left:26px}
.blk{display:flex;align-items:flex-start}
.lf{flex:0 0 156px;width:156px;background:var(--bg);position:relative;z-index:3}
.lr{display:grid;grid-template-columns:22px 1fr;gap:4px;align-items:center;height:38px;padding:0 6px 0 8px;border-bottom:1px solid var(--ln);overflow:hidden;scroll-margin-top:110px}
.lr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr{display:grid;grid-template-columns:var(--w0,52px) var(--w1,52px) var(--w2,52px) var(--w3,52px);gap:4px;align-items:center;height:38px;padding:0 8px 0 4px;border-bottom:1px solid var(--ln)}
.hl,.hr{font-weight:600;color:var(--mut);font-size:13px;text-align:center}
.lr.tot,.rr.tot,.lr.gt,.rr.gt{background:var(--tot);font-weight:700}
.rr .v{background:var(--card);padding:4px 2px;border-radius:8px;text-align:center;font-size:12.5px}
.blk .sc{flex:1;min-width:0}
.dn,.dp{border-radius:8px;padding:4px 2px;font-weight:600}
.dn{background:rgba(46,160,67,.28)!important;color:#1e7a34}.dp{background:rgba(217,48,37,.25)!important;color:#c5221f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dn{color:#7ee2a0}:root:not([data-theme="light"]) .dp{color:#ff9b94}}
#v2 .in{width:100%;min-width:0}
.row.s1,.hd.s1{grid-template-columns:22px minmax(0,1fr) var(--s0,62px) var(--s1,62px) var(--s2,62px)}
.sp{display:inline-block;width:14px;height:14px;border:2px solid var(--ln);border-top-color:var(--pri);border-radius:50%;animation:rot .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes rot{to{transform:rotate(360deg)}}
#rv{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;align-items:center;justify-content:center;padding:14px}
.rvb{max-height:88vh;display:flex;flex-direction:column}
#rvl{overflow-y:auto;margin:8px 0;flex:1}
.rvr{display:grid;grid-template-columns:24px 1fr 90px;gap:6px;align-items:center;padding:3px 0;font-size:13px}
.rvr input{padding:6px;text-align:center}
.row.s1.s2,.hd.s1.s2{grid-template-columns:22px minmax(0,1fr) var(--s0,62px)}
</style></head><body>
<div class="tabs"><button id="t1" class="on" onclick="tab(1)">On Hands</button><button id="t2" onclick="tab(2)">Summary</button></div>
<div class="bar"><button id="mb" onclick="menu(1)" aria-label="Menu">☰</button><input type="date" id="dt"><button id="sv" onclick="saveAll()">Save</button><button id="ul" style="display:none" onclick="askUnlock()">&#128274; Unlock</button><button id="up" style="display:none" onclick="pickImg()">Upload</button><input type="file" id="imf" accept="image/*" style="display:none" onchange="readImg(this)"><button onclick="expFile()">Export</button></div>
<div id="v1"></div><div id="v2" style="display:none"></div><div id="mn"><div class="ph"><span onclick="menu(0)">&#9776;</span><span onclick="menu(0)">&larr;</span><b>Product List</b></div>
<div class="pb"><div class="pbtn"><button class="bl" onclick="$('pf').click()">Upload Excel File</button><input type="file" id="pf" accept=".xlsx,.xls,.csv" style="display:none" onchange="upl(this)"><button class="bl" onclick="edit(-1)">Add New Product</button><button class="rd" id="clb" onclick="clr()">Clear Data</button></div>
<div id="pinfo"></div><input id="mq" placeholder="Search..." oninput="mlist()">
<div class="tb"><div class="th"><span>Sr</span><span>Name</span><span>Category</span><span>Action</span></div><div id="ml"></div></div></div></div>
<div id="md"><div class="box"><h3><span id="et">Edit Product</span><span onclick="$('md').style.display='none'" style="cursor:pointer">&times;</span></h3>
<label>Product Name</label><input id="en"><label>Category</label><select id="ec"><option>FMC</option><option>VELO</option></select>
<div class="g2"><div><label>Retail Price</label><input id="er" inputmode="decimal"></div><div><label>W.S. Price</label><input id="ew" inputmode="decimal"></div>
<div><label>Packs/Outer</label><input id="eo" inputmode="decimal"></div><div><label>Sticks/Pack</label><input id="es" inputmode="decimal"></div><div><label>Outer/Carton</label><input id="eq" inputmode="decimal"></div></div>
<button class="bl" onclick="esave()">Save</button></div></div>
<div id="lk"><div class="box"><h3><span>&#128274; Unlock</span><span onclick="$('lk').style.display='none'" style="cursor:pointer">&times;</span></h3><input id="lp" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')unlock()"><button class="bl" onclick="unlock()">Unlock</button><div id="le" style="color:#d9534f;font-size:13px;margin-top:8px"></div></div></div>
<div id="rv"><div class="box rvb"><h3><span>Onhand figures</span><span onclick="$('rv').style.display='none'" style="cursor:pointer">&times;</span></h3><div id="rvm" style="font-size:13px"></div><div id="rvl"></div><div id="rvk" style="display:none;margin:6px 0"><input id="rvkey" type="password" placeholder="Claude API key (sk-ant-...)"><button class="bl" style="margin-top:6px" onclick="saveKey()">Key save karein</button></div>
<details><summary style="font-size:12px">OCR text</summary><pre id="rvt" style="font-size:11px;white-space:pre-wrap;max-height:120px;overflow:auto"></pre></details><button class="bl" onclick="applyRev()">Apply</button></div></div>
<div id="toast"></div>
<script src="xlsx.full.min.js"></script>
<script src="sql-asm.js"></script>
<script src="tesseract/tesseract.min.js"></script>
<script>
// [sr, naam, group, rate]  -- rate yahan ya app me naam par tap karke set karein
const F='FMC',V='VELO';
const DEF=[
[1,'dunhill SPL 20HL',F,0],[2,'Dunhill SPL 20HL',F,0],[3,'B & H 20HL',F,0],[4,'Gold Leaf 20HL',F,0],[5,'John Player 20 HL',F,0],[6,'Capstain Filter 20HL',F,0],[7,'Pall Mall 20HL',F,0],[8,'International 20HL',F,0],[9,'Gold Flake 20HL',F,0],
[10,'SKU 10',F,0],[11,'SKU 11',F,0],[12,'SKU 12',F,0],[13,'Lucky Strike 20HL',F,0],
[14,'Berry Frost 10MG',V,0],[15,'Berry Frost 14MG',V,0],[16,'Berry Frost 6MG',V,0],[17,'Groovy Grape 10MG',V,0],[18,'Frosty Lemon 10MG',V,0],[19,'Polar Mint 10MG',V,0],[20,'Polar Mint 14MG',V,0],[21,'Polar Mint 6MG',V,0],[22,'Rich Elaichi 10MG',V,0],[23,'Papper Storm 14MG',V,0],
[24,'SKU 24',V,0],[25,'SKU 25',V,0],[26,'SKU 26',V,0],[27,'SKU 27',V,0],[28,'SKU 28',V,0],
[29,'Polar Mint 17MG',V,0],[30,'Groovy Grape 17MG',V,0],[31,'Polar Mint 4MG',V,0],[32,'Berry Frost 4MG',V,0]];
let PR=null,ITEMS=[];
try{const raw=localStorage.getItem('pl');if(raw)PR=JSON.parse(raw)}catch(e){}
if(!PR)PR=DEF.map(d=>({id:d[0],name:d[1],cat:d[2],retail:0,ws:0,ppo:10,spp:20,opc:d[2]==='VELO'?24:50}));
function rebuild(){ITEMS=PR.map(p=>[p.id,p.name,p.cat,0])}
const savePR=()=>{try{localStorage.setItem('pl',JSON.stringify(PR))}catch(e){}};
rebuild();
const td=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let S={date:td(),dr:0,q:{},rate:{},days:{}};
try{const x=JSON.parse(localStorage.getItem('oh2')||'null');if(x){S.rate=x.rate||{};S.days=x.days||{};if(!x.days&&x.q)S.days[x.date]=x.q}}catch(e){}
S.q=S.days[S.date]||(S.days[S.date]={});
const save=()=>{try{S.days[S.date]=S.q;localStorage.setItem('oh2',JSON.stringify({date:S.date,days:S.days,rate:S.rate}))}catch(e){}};
const q=i=>S.q[i[0]]||{};
const num=v=>parseFloat(v)||0;
const f3=x=>x.toFixed(3),f2=x=>x.toFixed(2);
const added=i=>['c','o','p','m'].some(k=>q(i)[k]!==undefined&&q(i)[k]!=='');
const K=['c','o','p','m'];
const HD='<div class="hd"><span>Sr</span><span>Brands</span><span>Carton</span><span>Outer</span><span>Packs</span><span>M\'s</span></div>';
function sums(list){const t=[0,0,0,0];list.forEach(i=>K.forEach((k,j)=>t[j]+=num(q(i)[k])));return t}
function totRow(label,s,cls){return `<div class="row ${cls||'tot'}"><span></span><span>${label}</span>${s.map(x=>`<span class="v">${f3(x)}</span>`).join('')}</div>`}
const HDL='<div class="lr hl"><span>Sr</span><span>Brands</span></div>';
const totL=(l,c)=>`<div class="lr ${c||'tot'}"><span></span><span>${l}</span></div>`;
const totR=(s,c)=>`<div class="rr ${c||'tot'}">${s.map((x,j)=>`<span class="v">${j<3?String(+x.toFixed(3)):f3(x)}</span>`).join('')}</div>`;
function blk(L,R,c){return `<div class="blk"><div class="lf">${L}</div><div class="sc ${c||''}" onscroll="syncScroll(this)"><div class="in">${R}</div></div></div>`}
function r1(){
 const sx=(document.querySelector('#v1 .sc')||{}).scrollLeft||0;
 let h=blk(HDL,'<div class="rr hr">'+['Carton','Outer','Packs',"M's"].map(x=>`<span>${x}</span>`).join('')+'</div>','nb');
 [F,V].forEach(g=>{const L=ITEMS.filter(i=>i[2]===g);let a='',b='';
  L.forEach(i=>{a+=`<div class="lr" id="r${i[0]}"><span class="sr">${i[0]}</span><span class="nm">${i[1]}</span></div>`;
   b+=`<div class="rr" id="x${i[0]}">`+K.map(k=>`<input class="n" inputmode="${k==='m'?'decimal':'tel'}" enterkeyhint="next" autocomplete="off"${k==='m'?' tabindex="-1"':''} value="${q(i)[k]??''}" onfocus="foc(this,${i[0]},'${k}')" onkeydown="nk(event,this)" oninput="if(!/^[=+]/.test(this.value.trim()))inp(${i[0]},'${k}',this.value);fit()" onblur="bl(this,${i[0]},'${k}')">`).join('')+`</div>`});
  a+=totL('Total '+g);b+=`<div id="g${g}">${totR(sums(L))}</div>`;
  h+=blk(a,b)});
 h+=blk(totL('Grand Total','gt'),`<div id="gt">${totR(sums(ITEMS),'gt')}</div>`,'nb');
 document.getElementById('v1').innerHTML=h;fit();
 document.querySelectorAll('#v1 .sc').forEach(o=>o.scrollLeft=sx);
 if(LK)document.querySelectorAll('#v1 input').forEach(x=>x.readOnly=true)}
function inp(id,k,v){S.q[id]=S.q[id]||{};const Q=S.q[id];Q[k]=v;Q.F=Q.F||{};delete Q.F[k];
 const p=PR.find(x=>x.id===id)||{},ppo=p.ppo||10,spp=p.spp||20,op=ppo*spp,cp=(p.opc||(p.cat==='VELO'?24:50))*op;
 const e=document.getElementById('x'+id),ins=e?e.querySelectorAll('input'):[];
 const sh=(j,x)=>{if(ins[j])ins[j].value=x?String(x):''};
 if(k==='m'){delete Q.F.c;delete Q.F.o;delete Q.F.p;let t=Math.round(num(v)*1000);const c=Math.floor(t/cp);t-=c*cp;const o=Math.floor(t/op);t-=o*op;const pk=Math.floor(t/spp);Q.c=c?String(c):'';Q.o=o?String(o):'';Q.p=pk?String(pk):'';sh(0,Q.c);sh(1,Q.o);sh(2,Q.p)}
 else{delete Q.F.m;const t=num(Q.c)*cp+num(Q.o)*op+num(Q.p)*spp;Q.m=t?(t/1000).toFixed(3):'';sh(3,Q.m)}
 save();
 [F,V].forEach(g=>document.getElementById('g'+g).innerHTML=totR(sums(ITEMS.filter(x=>x[2]===g))));
 document.getElementById('gt').innerHTML=totR(sums(ITEMS),'gt');fit()}
const HD2='<div class="hd s1"><span>Sr</span><span>Brands</span><span>Onhand</span><span>M\'s</span><span>Diff</span></div>';
const HD3='<div class="hd s1 s2"><span>Sr</span><span>Brands</span><span>M\'s</span></div>';
const dc=x=>x<-0.0005?' dn':x>0.0005?' dp':'';
let S2=false;
function tr1(l,a,c){return `<div class="row ${c||'tot'} s1${S2?' s2':''}"><span></span><span>${l}</span>${a.map((x,j)=>`<span class="v${a.length===3&&j===2?dc(x):''}">${f3(x)}</span>`).join('')}</div>`}
function ohv(i){const o=(S.q.OH||{})[i[0]];return o===undefined||o===null||o===''?null:num(o)}
function r2(){
 const has=ITEMS.some(i=>ohv(i)!==null);S2=!has;
 const L=ITEMS.filter(i=>added(i)||ohv(i)!==null);
 if(!L.length){$('v2').innerHTML='<div class="empty">On Hands me abhi koi SKU add nahi hui</div>';return}
 const tt=G=>{let o=0,m=0;G.forEach(i=>{o+=ohv(i)||0;m+=num(q(i).m)});return has?[o,m,o-m]:[m]};
 let h=has?HD2:HD3;
 [F,V].forEach(g=>{const G=L.filter(i=>i[2]===g);if(!G.length)return;
  G.forEach(i=>{const o=ohv(i)||0,m=num(q(i).m);
   h+=`<div class="row s1${has?'':' s2'}"><span class="sr">${i[0]}</span><span class="nm">${i[1]}</span>`+(has?`<span style="text-align:center">${f3(o)}</span><span style="text-align:center">${f3(m)}</span><span class="c${dc(o-m)}" style="text-align:center">${f3(o-m)}</span>`:`<span style="text-align:center">${f3(m)}</span>`)+`</div>`});
  h+=tr1('Total '+g,tt(G))});
 h+=tr1('Grand Total',tt(L),'gt');
 $('v2').innerHTML='<div class="sc"><div class="in">'+h+'</div></div>';fitS()}
function fitS(){const m=[3,3,3];document.querySelectorAll('#v2 .row').forEach(r=>{for(let j=0;j<3;j++){const c=r.children[2+j];if(!c)continue;const l=c.textContent.length;if(l>m[j])m[j]=l}});
 const st=$('v2').style;m.forEach((l,j)=>st.setProperty('--s'+j,Math.max(62,l*9+18)+'px'))}
function tab(n){TB=n;btns();document.getElementById('t1').className=n==1?'on':'';document.getElementById('t2').className=n==2?'on':'';
 document.getElementById('v1').style.display=n==1?'':'none';document.getElementById('v2').style.display=n==2?'':'none';if(n==2)r2()}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function exp(){
 const L=ITEMS.filter(added);const s=sums(L);
 let t=`On Hands - ${S.date}\n`;
 L.forEach(i=>t+=`${i[0]}. ${i[1]} | Carton ${f3(num(q(i).c))} | Outer ${f3(num(q(i).o))} | Packs ${f3(num(q(i).p))} | M's ${f3(num(q(i).m))}\n`);
 t+=`Grand Total | Carton ${f3(s[0])} | Outer ${f3(s[1])} | Packs ${f3(s[2])} | M's ${f3(s[3])}`;
 if(navigator.share){navigator.share({text:t}).catch(()=>{});return}
 try{navigator.clipboard.writeText(t).then(()=>toast('Copy ho gaya'),()=>toast('Copy nahi hua'))}catch(e){toast('Copy nahi hua')}}
const dt=document.getElementById('dt');
dt.value=S.date;dt.onchange=()=>{if(!dt.value){dt.value=S.date;return}save();S.date=dt.value;S.q=S.days[S.date]||(S.days[S.date]={});save();r1();r2()};

function ev(t){let p=0;const w=()=>{while(t[p]===' ')p++};
 function ex(){let v=tm();for(;;){w();const c=t[p];if(c==='+'){p++;v+=tm()}else if(c==='-'){p++;v-=tm()}else return v}}

 const r=ex();w();if(p<t.length)throw 0;return r}

function parseLines(lines){
 const re=/(?<![\w.])-?\d+(?:[.,]\d+)?(?!\s*(?:hl|mg)\b)(?![\w])/gi;
 const ys=lines.map(l=>l.y).filter(y=>y!=null);let pitch=0;
 if(ys.length>3){const d=[];for(let i=1;i<ys.length;i++)d.push(ys[i]-ys[i-1]);d.sort((a,b)=>a-b);pitch=d[Math.floor(d.length/2)]}
 const rows=[];let prevY=null;
 lines.forEach(l=>{const t=String(l.t).trim();if(!t)return;
  if(/^(grand\s*)?total/i.test(t)||/\d+\s*[\/\-.]\s*\d+\s*[\/\-.]\s*\d{2,4}/.test(t))return;
  const nums=(t.match(re)||[]).map(x=>parseFloat(x.replace(',','.')));
  const dash=!nums.length&&/^[\s\-\u2013\u2014_=~.:|]+$/.test(t);
  if(!nums.length&&!dash)return;
  if(pitch>0&&prevY!=null&&l.y!=null){const gap=Math.round((l.y-prevY)/pitch)-1;for(let g=0;g<gap&&g<5;g++)rows.push(null)}
  if(l.y!=null)prevY=l.y;
  rows.push(nums.length?nums[nums.length-1]:null)});
 const m={};rows.forEach((v,k)=>{if(v!==null&&k<ITEMS.length)m[ITEMS[k][0]]=v});return m}
async function prep(f){try{const u=URL.createObjectURL(f);
 const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=u});
 const sc=Math.min(4,1800/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
 const g=c.getContext('2d');g.filter='grayscale(1) contrast(1.4)';g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);return c}catch(e){return f}}
async function ocrText(f){const base=new URL('tesseract/',location.href).href;
 const run=(async()=>{const w=await Tesseract.createWorker('eng',1,{workerPath:base+'worker.min.js',corePath:base,langPath:base,gzip:true});

   const r=await w.recognize(cv);return {text:r.data.text,lines:(r.data.lines||[]).map(l=>({t:l.text,y:l.bbox?(l.bbox.y0+l.bbox.y1)/2:null}))}}finally{try{await w.terminate()}catch(e){}}})();
