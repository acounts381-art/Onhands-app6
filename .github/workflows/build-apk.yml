name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download libraries
        run: |
          curl -fL -o www/xlsx.full.min.js https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js
          curl -fL -o www/sql-asm.js https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-asm.js
      - run: npm install
      - name: Copy OCR files
        run: |
          mkdir -p www/tesseract
          cp node_modules/tesseract.js/dist/tesseract.min.js www/tesseract/
          cp node_modules/tesseract.js/dist/worker.min.js www/tesseract/
          cp node_modules/tesseract.js-core/tesseract-core* www/tesseract/
          cp node_modules/@tesseract.js-data/eng/4.0.0_best_int/eng.traineddata.gz www/tesseract/
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: onhands-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
